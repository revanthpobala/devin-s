name: CI Pipeline

on:
  push:
    branches: [ main, master, "refactor/*", "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .
      - name: Run Pytest
        run: |
          pytest
